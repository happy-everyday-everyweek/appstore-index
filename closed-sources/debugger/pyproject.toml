[project]
name = "apkmesh-source-debugger"
version = "0.1.0"
description = "Offline and live debugger for APK Mesh JavaScript sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "playwright>=1.52,<2",
  "quickjs>=1.19,<2",
]

[project.scripts]
apkmesh-debug = "apkmesh_debug.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apkmesh_debug"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
