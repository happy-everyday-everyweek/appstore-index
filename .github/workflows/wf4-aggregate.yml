name: WF4 聚合 Release 分发

on:
  schedule:
    - cron: "17 */4 * * *"   # 每天 5 次（约每 4 小时）
  workflow_dispatch:
    inputs:
      run_index:
        description: 当天第几次运行（1-5），用于变更判定
        default: "1"

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 变更判定并发布三件套
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INDEX="${{ github.event.inputs.run_index || '1' }}"
          python3 scripts/aggregate.py \
            --repo "${{ github.repository }}" \
            --run-index "$INDEX"