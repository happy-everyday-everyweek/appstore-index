name: WF4 聚合 Release 分发

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
  schedule:
    - cron: "17 */4 * * *"   # 每天 5 次（约每 4 小时）
  workflow_dispatch:
    inputs:
      run_index:
        description: 当天第几次运行（1-5），用于变更判定
        default: "1"

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 v2 资产生成依赖（图标 blurhash 占位，§4.2）
        run: pip install blurhash pillow numpy
      - name: 变更判定并发布三件套（v1 双轨，§5.1）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INDEX="${{ github.event.inputs.run_index || '1' }}"
          python3 scripts/aggregate.py \
            --repo "${{ github.repository }}" \
            --run-index "$INDEX"
      - name: 清单驱动资产生成与发布（v2 双轨，§5.1）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_PAT: ${{ secrets.MAIN_PAT }}
        run: |
          python3 scripts/aggregate_v2.py \
            --repo "${{ github.repository }}"