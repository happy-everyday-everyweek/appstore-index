name: WF2 应用核验与信息采集

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/**/app.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 核验链 + 采集元数据 + 分配系统 ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_scan.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --close
          echo "VERIFY_OK=1" >> "$GITHUB_ENV"
      - name: 合并后提交生成文件（app-info.json / README.md）
        if: env.VERIFY_OK == '1' && github.event.pull_request.merged == 'true'
        run: |
          git config user.name "appstore-ci"
          git config user.email "appstore-ci@users.noreply.github.com"
          git add apps/
          git commit -m "chore: 核验采集落盘（工作流 2）" || echo "无变更"
          git push