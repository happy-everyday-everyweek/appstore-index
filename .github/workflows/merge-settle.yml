name: Merge-Settle 合并落盘
on:
  push:
    branches: [main]
    paths:
      - "apps/**/app.json"
  workflow_dispatch:
concurrency:
  # 同一时间只跑一个 merge-settle；新 push 的 run 排队等待（不取消旧 run，
  # 避免落盘中途被打断丢失）。直链增量快检保证排队 run 只处理新增 apkUrl，快速收敛。
  group: settle-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: android-actions/setup-android@v3
      - name: 安装 build-tools（aapt2 解包 APK）
        run: sdkmanager "build-tools;34.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 采集落盘并提交（含 README 依赖资源）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AAPT2: ${{ env.ANDROID_HOME }}/build-tools/34.0.0/aapt2
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 scripts/verify_scan.py \
            --repo "${{ github.repository }}" \
            --pr 0 \
            --author "${{ github.actor }}" \
            --commit
          git config user.name "appstore-ci"
          git config user.email "appstore-ci@users.noreply.github.com"
          git add apps/
          git commit -m "chore: 采集落盘 app-info.json 与 README.md（merge-settle）" || echo "无变更"
          # 重试推送：远端被并发推进时 pull --rebase 后重推（最多 5 次）
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break || { git pull --rebase origin main 2>/dev/null || true; sleep 4; }
          done